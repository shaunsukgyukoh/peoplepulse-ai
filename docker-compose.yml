name: peoplepulse

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: peoplepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peoplepulse}
      POSTGRES_USER: ${POSTGRES_USER:-peoplepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - peoplepulse_postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peoplepulse} -d ${POSTGRES_DB:-peoplepulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - peoplepulse-net

  redis:
    image: redis:8.10.0-alpine
    container_name: peoplepulse-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-change-me-local-only}
    # Slack message text is a transient processing payload. Disable Redis disk
    # persistence so queued masked text is not durably stored on the host.
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --requirepass
      - ${REDIS_PASSWORD:-change-me-local-only}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - peoplepulse-net

  slack-listener:
    profiles: ["slack"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peoplepulse-slack-listener
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-local-only}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_STREAM_SLACK_EVENTS: ${REDIS_STREAM_SLACK_EVENTS:-peoplepulse:slack-events}
      REDIS_STREAM_NLP_RESULTS: ${REDIS_STREAM_NLP_RESULTS:-peoplepulse:nlp-results}
      REDIS_STREAM_SLACK_MAXLEN: ${REDIS_STREAM_SLACK_MAXLEN:-10000}
      SLACK_EVENT_DEDUP_TTL_SECONDS: ${SLACK_EVENT_DEDUP_TTL_SECONDS:-604800}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      EMPLOYEE_HASH_KEY: ${EMPLOYEE_HASH_KEY:-replace-with-a-long-random-secret}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - peoplepulse-net

  nlp-worker:
    profiles: ["nlp"]
    build:
      context: .
      dockerfile: Dockerfile.nlp
    container_name: peoplepulse-nlp-worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-peoplepulse}
      POSTGRES_USER: ${POSTGRES_USER:-peoplepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-local-only}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_STREAM_SLACK_EVENTS: ${REDIS_STREAM_SLACK_EVENTS:-peoplepulse:slack-events}
      REDIS_STREAM_NLP_RESULTS: ${REDIS_STREAM_NLP_RESULTS:-peoplepulse:nlp-results}
      REDIS_STREAM_NLP_MAXLEN: ${REDIS_STREAM_NLP_MAXLEN:-50000}
      NLP_CONSUMER_GROUP: ${NLP_CONSUMER_GROUP:-peoplepulse:nlp-workers}
      NLP_BATCH_SIZE: ${NLP_BATCH_SIZE:-8}
      NLP_BLOCK_MS: ${NLP_BLOCK_MS:-5000}
      NLP_PENDING_MIN_IDLE_MS: ${NLP_PENDING_MIN_IDLE_MS:-60000}
      NLP_RECOVERY_INTERVAL_SECONDS: ${NLP_RECOVERY_INTERVAL_SECONDS:-30}
      NLP_BACKEND: ${NLP_BACKEND:-transformer}
      NLP_MODEL_PATH: ${NLP_MODEL_PATH:-/models/selected}
      NLP_BASELINE_MODEL_PATH: ${NLP_BASELINE_MODEL_PATH:-/models/tfidf-logreg/model.joblib}
      NLP_THRESHOLD: ${NLP_THRESHOLD:-0.5}
      NLP_DEVICE: ${NLP_DEVICE:-auto}
    volumes:
      - ./artifacts/models:/models
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - peoplepulse-net

  api:
    profiles: ["activity", "dashboard", "mlops", "agent"]
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: peoplepulse-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-peoplepulse}
      POSTGRES_USER: ${POSTGRES_USER:-peoplepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      EMPLOYEE_HASH_KEY: ${EMPLOYEE_HASH_KEY:-replace-with-a-long-random-secret}
      ACTIVITY_ADMIN_TOKEN: ${ACTIVITY_ADMIN_TOKEN:-replace-with-a-long-random-admin-token}
      ACTIVITY_CONTENT_POLICY_PATH: configs/activity_content_policy.json
      ACTIVITY_MAX_UPLOAD_BYTES: ${ACTIVITY_MAX_UPLOAD_BYTES:-20971520}
      ACTIVITY_WORKDAY_START_HOUR: ${ACTIVITY_WORKDAY_START_HOUR:-9}
      ACTIVITY_WORKDAY_END_HOUR: ${ACTIVITY_WORKDAY_END_HOUR:-18}
      ACTIVITY_PRIVACY_MODE: ${ACTIVITY_PRIVACY_MODE:-aggregate}
      ACTIVITY_MIN_COHORT_SIZE: ${ACTIVITY_MIN_COHORT_SIZE:-5}
      ACTIVITY_DEMO_FILENAME_PREFIX: ${ACTIVITY_DEMO_FILENAME_PREFIX:-Synthetic_}
      DASHBOARD_STEP6_ARTIFACT_ROOT: /artifacts/ml/step6
      DASHBOARD_STEP6_REFERENCE_METRICS_PATH: /app/docs/experiment-results/step6_reference_metrics.json
      DASHBOARD_NLP_METRICS_PATH: /app/docs/experiment-results/nlp_model_comparison_step3_1.json
      DASHBOARD_SHAP_PATH: /artifacts/ml/step6/privacy_safe/shap/shap_feature_importance.csv
      DASHBOARD_STREAM_INTERVAL_SECONDS: ${DASHBOARD_STREAM_INTERVAL_SECONDS:-2}
      DASHBOARD_ALLOWED_ORIGINS: ${DASHBOARD_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      MLOPS_MONITORING_ARTIFACT_ROOT: /artifacts/monitoring
      MLOPS_MONITORING_SCOPE: ${MLOPS_MONITORING_SCOPE:-synthetic_demo}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AGENT_OLLAMA_BASE_URL: ${AGENT_OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      AGENT_OLLAMA_MODEL: ${AGENT_OLLAMA_MODEL:-qwen3:8b}
      AGENT_TEMPERATURE: ${AGENT_TEMPERATURE:-0}
      AGENT_NUM_CTX: ${AGENT_NUM_CTX:-16384}
      AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT:-12}
      AGENT_DEFAULT_SCOPE: ${AGENT_DEFAULT_SCOPE:-aggregate}
    volumes:
      - ./artifacts:/artifacts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - peoplepulse-net

  dashboard:
    profiles: ["dashboard", "agent"]
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: peoplepulse-dashboard
    restart: unless-stopped
    environment:
      PEOPLEPULSE_API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - peoplepulse-net


  mlflow:
    profiles: ["mlops"]
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: peoplepulse-mlflow
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peoplepulse}
      POSTGRES_USER: ${POSTGRES_USER:-peoplepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MLFLOW_POSTGRES_DB: ${MLFLOW_POSTGRES_DB:-peoplepulse_mlflow}
      MLFLOW_WORKERS: ${MLFLOW_WORKERS:-1}
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,mlflow:5000,peoplepulse-mlflow:5000}
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: ${MLFLOW_SERVER_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5000,http://127.0.0.1:5000}
    volumes:
      - peoplepulse_mlflow_artifacts:/mlflow/artifacts
      - peoplepulse_mlflow_prometheus:/mlflow/prometheus
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5); assert r.status == 200"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - peoplepulse-net

  monitoring-worker:
    profiles: ["mlops"]
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    container_name: peoplepulse-monitoring-worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-peoplepulse}
      POSTGRES_USER: ${POSTGRES_USER:-peoplepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AGENT_OLLAMA_BASE_URL: ${AGENT_OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      AGENT_OLLAMA_MODEL: ${AGENT_OLLAMA_MODEL:-qwen3:8b}
      AGENT_TEMPERATURE: ${AGENT_TEMPERATURE:-0}
      AGENT_NUM_CTX: ${AGENT_NUM_CTX:-16384}
      AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT:-12}
      AGENT_DEFAULT_SCOPE: ${AGENT_DEFAULT_SCOPE:-aggregate}
      MLFLOW_MONITORING_EXPERIMENT: ${MLFLOW_MONITORING_EXPERIMENT:-PeoplePulse-Monitoring-Step8}
      MLOPS_MONITORING_SCOPE: ${MLOPS_MONITORING_SCOPE:-synthetic_demo}
      MLOPS_MONITORING_INTERVAL_SECONDS: ${MLOPS_MONITORING_INTERVAL_SECONDS:-3600}
      MLOPS_REFERENCE_MONTHS: ${MLOPS_REFERENCE_MONTHS:-6}
      MLOPS_CURRENT_MONTHS: ${MLOPS_CURRENT_MONTHS:-3}
      MLOPS_DRIFT_SHARE_THRESHOLD: ${MLOPS_DRIFT_SHARE_THRESHOLD:-0.30}
      MLOPS_FEATURE_SET: ${MLOPS_FEATURE_SET:-privacy_safe}
      MLOPS_SYNTHETIC_PANEL_PATH: /data/synthetic/ml/step6_attrition_panel.csv
      MLOPS_PREDICTIONS_PATH: /artifacts/ml/step6/privacy_safe/test_predictions.csv
      MLOPS_MONITORING_ARTIFACT_ROOT: /artifacts/monitoring
    volumes:
      - ./data:/data:ro
      - ./artifacts:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    networks:
      - peoplepulse-net

  prometheus:
    profiles: ["mlops"]
    image: prom/prometheus:v3.13.2
    container_name: peoplepulse-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - peoplepulse_prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_started
      mlflow:
        condition: service_healthy
    networks:
      - peoplepulse-net

  grafana:
    profiles: ["mlops"]
    image: grafana/grafana:13.1.0
    container_name: peoplepulse-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - peoplepulse_grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - peoplepulse-net

volumes:
  peoplepulse_postgres_data:
  peoplepulse_mlflow_artifacts:
  peoplepulse_mlflow_prometheus:
  peoplepulse_prometheus_data:
  peoplepulse_grafana_data:

networks:
  peoplepulse-net:
    driver: bridge
