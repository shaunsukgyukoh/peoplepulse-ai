name: peoplepulse

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: peoplepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peoplepulse}
      POSTGRES_USER: ${POSTGRES_USER:-peoplepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - peoplepulse_postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peoplepulse} -d ${POSTGRES_DB:-peoplepulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - peoplepulse-net

  redis:
    image: redis:8.10.0-alpine
    container_name: peoplepulse-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-change-me-local-only}
    # Slack message text is a transient processing payload. Disable Redis disk
    # persistence so queued masked text is not durably stored on the host.
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --requirepass
      - ${REDIS_PASSWORD:-change-me-local-only}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - peoplepulse-net

  slack-listener:
    profiles: ["slack"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peoplepulse-slack-listener
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-local-only}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_STREAM_SLACK_EVENTS: ${REDIS_STREAM_SLACK_EVENTS:-peoplepulse:slack-events}
      REDIS_STREAM_NLP_RESULTS: ${REDIS_STREAM_NLP_RESULTS:-peoplepulse:nlp-results}
      REDIS_STREAM_SLACK_MAXLEN: ${REDIS_STREAM_SLACK_MAXLEN:-10000}
      SLACK_EVENT_DEDUP_TTL_SECONDS: ${SLACK_EVENT_DEDUP_TTL_SECONDS:-604800}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      EMPLOYEE_HASH_KEY: ${EMPLOYEE_HASH_KEY:-replace-with-a-long-random-secret}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - peoplepulse-net

  nlp-worker:
    profiles: ["nlp"]
    build:
      context: .
      dockerfile: Dockerfile.nlp
    container_name: peoplepulse-nlp-worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-peoplepulse}
      POSTGRES_USER: ${POSTGRES_USER:-peoplepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-local-only}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_STREAM_SLACK_EVENTS: ${REDIS_STREAM_SLACK_EVENTS:-peoplepulse:slack-events}
      REDIS_STREAM_NLP_RESULTS: ${REDIS_STREAM_NLP_RESULTS:-peoplepulse:nlp-results}
      REDIS_STREAM_NLP_MAXLEN: ${REDIS_STREAM_NLP_MAXLEN:-50000}
      NLP_CONSUMER_GROUP: ${NLP_CONSUMER_GROUP:-peoplepulse:nlp-workers}
      NLP_BATCH_SIZE: ${NLP_BATCH_SIZE:-8}
      NLP_BLOCK_MS: ${NLP_BLOCK_MS:-5000}
      NLP_PENDING_MIN_IDLE_MS: ${NLP_PENDING_MIN_IDLE_MS:-60000}
      NLP_RECOVERY_INTERVAL_SECONDS: ${NLP_RECOVERY_INTERVAL_SECONDS:-30}
      NLP_BACKEND: ${NLP_BACKEND:-transformer}
      NLP_MODEL_PATH: ${NLP_MODEL_PATH:-/models/selected}
      NLP_BASELINE_MODEL_PATH: ${NLP_BASELINE_MODEL_PATH:-/models/tfidf-logreg/model.joblib}
      NLP_THRESHOLD: ${NLP_THRESHOLD:-0.5}
      NLP_DEVICE: ${NLP_DEVICE:-auto}
    volumes:
      - ./artifacts/models:/models
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - peoplepulse-net

  api:
    profiles: ["activity", "dashboard"]
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: peoplepulse-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_DB: ${POSTGRES_DB:-peoplepulse}
      POSTGRES_USER: ${POSTGRES_USER:-peoplepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      EMPLOYEE_HASH_KEY: ${EMPLOYEE_HASH_KEY:-replace-with-a-long-random-secret}
      ACTIVITY_ADMIN_TOKEN: ${ACTIVITY_ADMIN_TOKEN:-replace-with-a-long-random-admin-token}
      ACTIVITY_CONTENT_POLICY_PATH: configs/activity_content_policy.json
      ACTIVITY_MAX_UPLOAD_BYTES: ${ACTIVITY_MAX_UPLOAD_BYTES:-20971520}
      ACTIVITY_WORKDAY_START_HOUR: ${ACTIVITY_WORKDAY_START_HOUR:-9}
      ACTIVITY_WORKDAY_END_HOUR: ${ACTIVITY_WORKDAY_END_HOUR:-18}
      ACTIVITY_PRIVACY_MODE: ${ACTIVITY_PRIVACY_MODE:-aggregate}
      ACTIVITY_MIN_COHORT_SIZE: ${ACTIVITY_MIN_COHORT_SIZE:-5}
      ACTIVITY_DEMO_FILENAME_PREFIX: ${ACTIVITY_DEMO_FILENAME_PREFIX:-Synthetic_}
      DASHBOARD_STEP6_ARTIFACT_ROOT: /artifacts/ml/step6
      DASHBOARD_STEP6_REFERENCE_METRICS_PATH: /app/docs/experiment-results/step6_reference_metrics.json
      DASHBOARD_NLP_METRICS_PATH: /app/docs/experiment-results/nlp_model_comparison_step3_1.json
      DASHBOARD_SHAP_PATH: /artifacts/ml/step6/privacy_safe/shap/shap_feature_importance.csv
      DASHBOARD_STREAM_INTERVAL_SECONDS: ${DASHBOARD_STREAM_INTERVAL_SECONDS:-2}
      DASHBOARD_ALLOWED_ORIGINS: ${DASHBOARD_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./artifacts:/artifacts:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - peoplepulse-net

  dashboard:
    profiles: ["dashboard"]
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: peoplepulse-dashboard
    restart: unless-stopped
    environment:
      PEOPLEPULSE_API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks:
      - peoplepulse-net

volumes:
  peoplepulse_postgres_data:

networks:
  peoplepulse-net:
    driver: bridge
