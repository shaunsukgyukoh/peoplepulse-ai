[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "peoplepulse-ai"
version = "0.10.0"
description = "Privacy-aware employee retention intelligence portfolio project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=8.1,<9",
  "slack-bolt>=1.30,<2",
  "prometheus-client>=0.22,<1",
]

[project.optional-dependencies]
ml = [
  "joblib>=1.5,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.9,<2",
  "xgboost>=3.2,<3.3; python_version < '3.12'",
  "xgboost>=3.3,<4; python_version >= '3.12'",
  "lightgbm>=4.7,<5",
  "catboost>=1.2.10,<2",
  "shap>=0.50,<1",
  "matplotlib>=3.9,<4",
]
activity = [
  "fastapi>=0.141.1,<1",
  "uvicorn[standard]>=0.52.4,<1",
  "python-multipart>=0.0.32,<1",
  "pandas>=2.2,<3",
  "pandera[pandas]>=0.32.1,<1",
  "python-calamine>=0.8.2,<1",
]
nlp = [
  "joblib>=1.5,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.9,<2",
  "transformers>=5.14,<6",
]
nlp-cpu = [
  "torch>=2.13,<3",
]

agent = [
  "langchain>=1.3.14,<2",
  "langchain-ollama>=1.1.0,<2",
  "langgraph>=1.2.10,<2",
]

mlops = [
  "mlflow==3.15.1",
  "evidently==0.7.21",
  "joblib>=1.5,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.9,<2",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "numpy>=2.0,<3",
  "scikit-learn>=1.9,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
